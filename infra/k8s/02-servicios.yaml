# Microservicios de AulaNube. Las imágenes son arm64 y se importan en cada nodo
# (sin registro), por eso imagePullPolicy: Never.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identidad
  namespace: aulanube
spec:
  replicas: 1
  selector:
    matchLabels: { app: identidad }
  template:
    metadata:
      labels: { app: identidad, capa: servicio }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: identidad
          image: aulanube/identidad:v1
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: aulanube-secretos, key: DATABASE_URL_IDENTIDAD } }
            - name: JWT_SECRETO
              valueFrom: { secretKeyRef: { name: aulanube-secretos, key: JWT_SECRETO } }
            - name: CLAVE_DEMO
              valueFrom: { secretKeyRef: { name: aulanube-secretos, key: CLAVE_DEMO } }
          ports: [{ containerPort: 8000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /salud, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /salud, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: identidad, namespace: aulanube }
spec:
  selector: { app: identidad }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cursos
  namespace: aulanube
spec:
  replicas: 1
  selector:
    matchLabels: { app: cursos }
  template:
    metadata:
