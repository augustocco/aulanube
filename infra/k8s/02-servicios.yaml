---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aulanube
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, capa: borde }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      # Las dos réplicas en nodos distintos: si cae un nodo, la entrada sigue viva.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: gateway } }
      containers:
        - name: gateway
          image: aulanube/gateway:v1
          imagePullPolicy: Never
          env:
            - name: JWT_SECRETO
              valueFrom: { secretKeyRef: { name: aulanube-secretos, key: JWT_SECRETO } }
          ports: [{ containerPort: 8000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          readinessProbe: { httpGet: { path: /salud, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /salud, port: 8000 }, initialDelaySeconds: 15, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: aulanube }
spec:
  selector: { app: gateway }
  ports: [{ port: 8000 }]
