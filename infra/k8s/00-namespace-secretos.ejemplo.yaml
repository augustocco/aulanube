# Copie como 00-namespace-secretos.yaml, reemplace los valores y aplíquelo.
# El archivo real está excluido del repositorio (.gitignore).
apiVersion: v1
kind: Namespace
metadata:
  name: aulanube
---
apiVersion: v1
kind: Secret
metadata:
  name: aulanube-secretos
  namespace: aulanube
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<clave-superusuario>"
  CLAVE_DB_IDENTIDAD: "<clave-identidad>"
  CLAVE_DB_CURSOS: "<clave-cursos>"
  CLAVE_DB_CERTIFICADOS: "<clave-certificados>"
  CLAVE_DB_NOTIFICACIONES: "<clave-notificaciones>"
  DATABASE_URL_IDENTIDAD: "postgresql+psycopg://identidad:<clave-identidad>@postgres:5432/identidad"
  DATABASE_URL_CURSOS: "postgresql+psycopg://cursos:<clave-cursos>@postgres:5432/cursos"
  DATABASE_URL_CERTIFICADOS: "postgresql+psycopg://certificados:<clave-certificados>@postgres:5432/certificados"
  DATABASE_URL_NOTIFICACIONES: "postgresql+psycopg://notificaciones:<clave-notificaciones>@postgres:5432/notificaciones"
  JWT_SECRETO: "<cadena-aleatoria-de-64-caracteres>"
  CLAVE_DEMO: "AulaNube-2026"
